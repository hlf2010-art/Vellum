<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOD WORK — Decision study</title>
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;--paper:#f8f8f4;--card:#fff;--ink:#202722;--muted:#58635b;--line:#cbd1c9;--accent:#536d46;--tint:#e9efdf;background:var(--paper);color:var(--ink);font:15px/1.48 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{color-scheme:dark;--paper:#171c19;--card:#202721;--ink:#e9ece3;--muted:#b0b9ab;--line:#414a41;--accent:#b3cda5;--tint:#303d30}button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.36;cursor:default}[hidden]{display:none!important}.mono,.kicker,.top small,time{font:11px/1.4 ui-monospace,Menlo,monospace}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;height:56px;padding:0 max(5vw,20px)}.mark{width:20px;height:20px;display:grid;grid-template-columns:repeat(3,4px);gap:2px;align-items:center;transform:skew(-12deg)}.mark i{background:var(--ink);height:14px}.mark i:nth-child(2){height:8px}.top b{font-size:13px}.top small{color:var(--muted);border-left:1px solid var(--line);padding-left:12px}.tools{margin-left:auto;display:flex;gap:4px}.tools button{min-height:32px;padding:3px 8px;font-size:14px}.tools button:hover:not(:disabled){background:var(--tint)}main{max-width:1560px;margin:auto;padding:clamp(28px,5vh,64px) 5vw 30px}.kicker{text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font:normal clamp(38px,4.7vw,75px)/1.05 Georgia,serif;letter-spacing:-.055em;max-width:1000px;margin:11px 0 32px}.map{position:relative;display:grid;grid-template-columns:minmax(150px,.85fr) minmax(245px,1.3fr) minmax(190px,1fr);gap:clamp(35px,6vw,100px);padding:30px 0 36px;border-block:1px solid var(--line);align-items:center}.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.wire{fill:none;stroke:var(--line);stroke-width:1.4}.wire.hot{stroke:var(--accent)}.col{position:relative;min-width:0}.col>.kicker{margin-bottom:12px}.source,.output,.claim{width:100%;text-align:left}.source,.output{background:var(--paper);padding:11px 0;border-top:1px solid var(--line);display:block}.source strong{display:block;font-weight:550}.source small,.output small,.origin{display:block;color:var(--muted);font-size:12px}.source:hover,.output:hover{color:var(--accent)}.claim{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);padding:20px clamp(14px,2vw,32px) 18px}.claim strong{display:block;font:normal clamp(24px,2.35vw,38px)/1.13 Georgia,serif;letter-spacing:-.038em;margin:9px 0 16px}.claim .origin{display:flex;justify-content:space-between}.output b{font-weight:550;display:block;margin-top:5px}.active{color:var(--accent)}.active.source,.active.output{border-top-color:var(--accent)}.inspector{margin:24px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6vw}.inspector h2,.log h2{font:normal 28px/1.16 Georgia,serif;letter-spacing:-.03em;margin:8px 0 12px}.inspector p{max-width:64ch}.refs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.refs button,.soft{border:1px solid var(--line);padding:4px 9px;border-radius:3px;font-size:12px}.refs button:hover,.soft:hover{background:var(--tint)}textarea{width:100%;resize:vertical;background:var(--card);border:1px solid var(--line);padding:10px;min-height:70px;border-radius:2px}.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:7px}.primary{background:var(--ink);color:var(--paper);border-radius:3px;font-size:13px;padding:8px 14px}.example{font-size:12px;text-decoration:underline;text-underline-offset:3px;color:var(--muted);padding:0}.notice{font-size:13px;color:var(--accent);margin-top:8px}.delta{background:var(--tint);padding:16px 18px;border-left:2px solid var(--accent)}.delta p{margin:6px 0}.old{color:var(--muted);font-size:13px}.log{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}.log summary,details summary{cursor:pointer;color:var(--muted);font-size:13px}.log li{margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;font:13px/1.6 ui-monospace,monospace}code{overflow-wrap:anywhere}.updated{animation:arrive .85s both}@keyframes arrive{from{background:var(--tint);transform:translateY(3px)}to{transform:translateY(0)}}@media(max-width:760px){.map{grid-template-columns:1fr;gap:22px;padding:20px 0}.map svg{display:none}.col:first-of-type{display:block}.inspector{grid-template-columns:1fr;gap:16px}.source{padding:7px 0}.output{padding:8px 0}h1{margin-bottom:20px}.top small{display:none}.tools{gap:0}.top{gap:5px}.claim strong{font-size:28px}}@media(prefers-reduced-motion:reduce){.updated{animation:none}}
.viewport{position:relative;overflow:hidden;border-block:1px solid var(--line)}.map{border:0;transform-origin:0 0;touch-action:pan-y}.map button{touch-action:pan-y}#recenter{position:absolute;bottom:3px;right:4px;background:var(--paper)}.map.grabbing,.map.grabbing button{cursor:grabbing}@media(pointer:fine){.map{cursor:grab}} </style><body><header class="top"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><b>Creative Flow</b><small>MOD WORK</small><div class="tools"><button id="undo" title="Undo revision">↶ Undo</button><button id="redo" title="Redo revision">↷ Redo</button><button id="theme" aria-label="Toggle dark mode">◐</button></div></header>
<main><div class="kicker">MOD WORK / Creator experience</div><h1>Where does recovery break down?</h1><div class="viewport" id="viewport"><section class="map" id="map" aria-label="Evidence and dependencies"><svg id="wires" aria-hidden="true"></svg><div class="col"><div class="kicker">Project evidence</div><div id="sourceList"></div></div><div class="col"><div class="kicker">Working conclusion</div><button class="claim" data-node="claim" id="claim"></button></div><div class="col"><div class="kicker">What follows</div><button class="output" data-node="decision"><small>Research priority</small><b id="decision"></b></button><button class="output" data-node="test"><small>Creator test</small><b id="test"></b></button></div></section><button id="recenter" class="soft" hidden>Reset view</button></div><section class="inspector" id="inspector"></section><p class="notice" role="status" id="status"></p><details class="log"><summary id="logTitle">Revision history</summary><ol id="history"></ol></details></main>
<script id="data" type="application/json">__DATA__</script><script>
const $=id=>document.getElementById(id),data=JSON.parse($('data').textContent),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='creative-flow.mod-review.1';let state={entries:[{value:data.base,question:'Initial synthesis',time:Date.now(),parent:null}],at:0,redo:[]};try{const saved=JSON.parse(localStorage.getItem(key));if(saved?.entries?.[saved.at]?.value)state=saved}catch{}
let selected='claim',draft='',proposal=null,request=null;const current=()=>state.entries[state.at].value;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{$('status').textContent='Changes are available in this session only.'}}
function node(id){return document.querySelector('[data-node="'+id+'"]')}
function wires(){const box=$('map').getBoundingClientRect();const links=[...current().sources.map(id=>[id,'claim']),['claim','decision'],['claim','test']];$('wires').innerHTML=links.map(([a,b])=>{const from=node(a),to=node(b);if(!from||!to)return '';const l=from.getBoundingClientRect(),r=to.getBoundingClientRect(),scale=box.width/$('map').offsetWidth,x=(l.right-box.left)/scale,y=(l.top+l.height/2-box.top)/scale,z=(r.left-box.left)/scale,t=(r.top+r.height/2-box.top)/scale,m=(x+z)/2;return '<path class="wire '+([a,b].includes(selected)?'hot':'')+'" d="M'+x+' '+y+' C'+m+' '+y+' '+m+' '+t+' '+z+' '+t+'"/>'}).join('')}
function refs(ids){return '<div class="refs">'+ids.map(id=>'<button data-select="'+id+'">'+esc(data.sources.find(s=>s.id===id)?.title||id)+'</button>').join('')+'</div>'}
function select(id){selected=id;render();if(innerWidth<761)$('inspector').scrollIntoView({block:'start'})}
function render(){const v=current();$('sourceList').innerHTML=data.sources.map(s=>'<button class="source" data-node="'+s.id+'"><strong>'+esc(s.title)+'</strong><small>'+esc(s.kind)+'</small></button>').join('');
$('claim').innerHTML='<span class="mono">AI · Revision '+(state.at+1)+'</span><strong>'+esc(v.claim)+'</strong><span class="origin">'+v.sources.length+' linked sources <span>↗</span></span>';$('decision').textContent=v.decision;$('test').textContent=v.test;document.querySelectorAll('[data-node]').forEach(b=>{b.classList.toggle('active',b.dataset.node===selected);b.onclick=()=>select(b.dataset.node)});
$('undo').disabled=!!request||state.entries[state.at].parent===null;$('redo').disabled=!!request||!state.redo.length;
const src=data.sources.find(s=>s.id===selected);let left='',right='';
if(src){left='<div class="kicker">'+esc(src.kind)+'</div><h2>'+esc(src.title)+'</h2><p>'+esc(src.excerpt)+'</p>';right='<div class="kicker">Source record</div><p><code>'+esc(src.path)+'</code></p><details><summary>Read original excerpt</summary><pre>'+esc(src.original)+'</pre></details><div class="refs"><button data-select="claim">Return to conclusion ↗</button></div>'}
else if(selected!=='claim'){left='<div class="kicker">Derived from the conclusion</div><h2>'+esc(v[selected])+'</h2>';right='<p>'+esc(v.reason)+'</p><div class="refs"><button data-select="claim">Challenge the underlying conclusion ↗</button></div>'}
else{left='<div class="kicker">Basis for this conclusion</div><h2>What supports it?</h2><p>'+esc(v.reason)+'</p>'+refs(v.sources);
if(proposal){right='<div class="delta"><div class="kicker">Proposed revision</div>'+['claim','decision','test'].map((k,i)=>'<details '+(!i?'open':'')+'><summary>'+['Conclusion','Research priority','Creator test'][i]+'</summary><p class="old">Current · '+esc(v[k])+'</p><p>'+esc(proposal[k])+'</p></details>').join('')+'<p>'+esc(proposal.reason)+'</p>'+refs(proposal.sources)+'<div class="actions"><button class="soft" id="discard">Discard</button><button class="primary" id="apply">Apply revision ↗</button></div></div>'}
else right='<label class="kicker" for="challenge">Challenge the inference</label><textarea id="challenge" placeholder="What does the evidence actually establish?" '+(request?'disabled':'')+'>'+esc(draft)+'</textarea><div class="actions"><button class="example" id="example" '+(request?'disabled':'')+'>Try the evidence challenge</button><button class="primary" id="run">'+(request?'Cancel':'Reconsider ↗')+'</button></div>'}
$('inspector').innerHTML='<div>'+left+'</div><div>'+right+'</div>';$('inspector').querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>select(b.dataset.select));
if($('challenge')){$('challenge').oninput=e=>draft=e.target.value;$('example').onclick=()=>{draft=data.challenge;proposal=data.example;if(state.at!==0){proposal=null;render();run();return}render();$('status').textContent='Recorded local-model response to the opening conclusion. Review before applying.'};$('run').onclick=()=>request?request.abort():run()}
if($('apply')){$('discard').onclick=()=>{proposal=null;render();$('status').textContent='Proposal discarded.'};$('apply').onclick=()=>{const old=current();state.entries.push({value:proposal,question:draft,time:Date.now(),parent:state.at});state.at=state.entries.length-1;state.redo=[];draft='';proposal=null;save();render();['claim','decision','test'].filter(k=>old[k]!==current()[k]).forEach(k=>{const n=node(k);n.classList.remove('updated');void n.offsetWidth;n.classList.add('updated')});$('status').textContent='Revision applied. Project evidence preserved.'}}
$('history').innerHTML=state.entries.map((e,i)=>'<li><button class="soft" data-rev="'+i+'" '+(i===state.at||request?'disabled':'')+'>Revision '+(i+1)+'</button> '+esc(e.question)+'</li>').join('');$('logTitle').textContent='Revision history · '+state.entries.length;$('history').querySelectorAll('button').forEach(b=>b.onclick=()=>move(+b.dataset.rev,[]));requestAnimationFrame(camera)}
function move(at,redo){proposal=null;draft='';selected='claim';state.at=at;state.redo=redo;save();render();$('status').textContent='Viewing revision '+(at+1)}
$('undo').onclick=()=>move(state.entries[state.at].parent,[...state.redo,state.at]);$('redo').onclick=()=>move(state.redo.at(-1),state.redo.slice(0,-1));
async function run(){if(!draft.trim()){$('challenge').focus();return}const ctrl=new AbortController();request=ctrl;render();$('status').textContent='Reading the project evidence…';const timer=setTimeout(()=>ctrl.abort(),150000);
try{const r=await fetch('http://127.0.0.1:59631/studio/generate',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','X-Studio-Client':'canvas'},body:JSON.stringify({messages:[{role:'system',content:data.system},{role:'user',content:JSON.stringify({evidence:data.sources,current:current(),challenge:draft})}],response_format:{type:'json_schema',json_schema:{name:'revision',schema:data.schema}},max_tokens:850})});if(!r.ok)throw Error();const raw=await r.text();let text='';for(const l of raw.split('\n'))if(l.startsWith('data: {'))text+=JSON.parse(l.slice(6)).choices[0].delta.content||'';const p=JSON.parse(text);if(!['claim','reason','decision','test'].every(k=>typeof p[k]==='string'&&p[k].trim())||!p.sources?.length||p.sources.some(id=>!data.sources.find(s=>s.id===id)))throw Error();p.sources=[...new Set(p.sources)];proposal=p;selected='claim';$('status').textContent='Revision ready for review.'}catch{$('status').textContent=ctrl.signal.aborted?'Generation stopped.':'Could not generate a revision. Check the local Studio AI helper and retry.'}finally{clearTimeout(timer);request=null;render()}}
try{document.body.classList.toggle('dark',(localStorage.getItem(key+'.theme')|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark')}catch{}$('theme').onclick=()=>{const d=document.body.classList.toggle('dark');try{localStorage.setItem(key+'.theme',d?'dark':'light')}catch{}};
let cam={x:0,y:0,z:1},offsets={},drag=null,suppress=false;
function camera(){const m=$('map');m.style.transform='translate('+cam.x+'px,'+cam.y+'px) scale('+cam.z+')';for(const [id,v] of Object.entries(offsets)){const n=node(id);if(n)n.style.transform='translate('+v.x+'px,'+v.y+'px)'}$('recenter').hidden=!Object.keys(offsets).length&&cam.z===1&&!cam.x&&!cam.y;wires()}
$('viewport').addEventListener('pointerdown',e=>{if(e.button||e.target.closest('#recenter')||e.pointerType==='touch')return;const id=e.target.closest('[data-node]')?.dataset.node;drag={id,x:e.clientX,y:e.clientY,start:id?(offsets[id]||{x:0,y:0}):{...cam},moved:false};});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;drag.moved=true;$('map').classList.add('grabbing');if(drag.id)offsets[drag.id]={x:drag.start.x+dx/cam.z,y:drag.start.y+dy/cam.z};else{cam.x=drag.start.x+dx;cam.y=drag.start.y+dy}camera()});
window.addEventListener('pointerup',()=>{suppress=!!drag?.moved;drag=null;$('map').classList.remove('grabbing');setTimeout(()=>suppress=false,0)});
$('map').addEventListener('click',e=>{if(suppress){e.stopImmediatePropagation();e.preventDefault()}},true);
$('viewport').addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();const rect=$('viewport').getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,z=Math.max(.5,Math.min(2,cam.z*Math.exp(-e.deltaY*.008)));cam.x=x-(x-cam.x)*z/cam.z;cam.y=y-(y-cam.y)*z/cam.z;cam.z=z;camera()},{passive:false});
$('recenter').onclick=()=>{for(const id in offsets)node(id).style.transform='';offsets={};cam={x:0,y:0,z:1};camera()};
new ResizeObserver(wires).observe($('map'));render();
</script></body></html>
