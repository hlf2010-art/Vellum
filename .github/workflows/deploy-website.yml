# Publishes /website to Cloudflare Pages on every merge to main (and on demand from the Actions tab).
# Uses Wrangler's direct upload, so it doesn't need Cloudflare's GitHub app. Pages Functions
# (website/functions) and the KV binding set in the Cloudflare dashboard work the same way.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID. Without them the run skips with a warning instead of failing.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  PROJECT: vellum

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: keys
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was published. See website/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Create the Pages project (first run only)
        if: steps.keys.outputs.ready == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJECT"; then
            echo "Project $PROJECT exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          fi

      - name: Publish
        if: steps.keys.outputs.ready == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
