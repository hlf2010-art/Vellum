<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo directions</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: #08090b; color: #f4f5f7; min-height: 100vh; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1280px; margin: 0 auto; padding: 56px 32px; }
  .col { border-radius: 24px; background: #0e0f12; box-shadow: 0 0 0 .5px rgba(255,255,255,.07); padding: 28px; display: flex; flex-direction: column; gap: 26px; }
  .tag { font: 600 12.5px/1 var(--sans); color: rgba(244,245,247,.55); display: flex; gap: 10px; align-items: center; }
  .tag b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,.07); color: #fff; }
  .hero { position: relative; height: 260px; display: grid; place-items: center; border-radius: 16px; overflow: hidden; background: #08090b; }
  .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(42% 42% at 50% 50%, rgba(255,226,190,.11), transparent 72%); }
  .hero svg { filter: drop-shadow(0 0 22px rgba(255,226,190,.32)) drop-shadow(0 0 2px rgba(255,255,255,.4)); }
  .hero svg { position: relative; width: 190px; height: 190px; overflow: visible; }
  .row { display: flex; align-items: center; gap: 18px; }
  .tile { width: 84px; height: 84px; border-radius: 20px; display: grid; place-items: center; }
  .tile.dark { background: linear-gradient(180deg, #1d1e23, #121317); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12), 0 8px 20px -8px rgba(0,0,0,.8); }
  .tile.light { background: linear-gradient(180deg, #fff, #f0f1f4); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08); }
  .tile svg { width: 58px; height: 58px; overflow: visible; }
  .fav { display: flex; gap: 12px; align-items: center; }
  .fav span { display: grid; place-items: center; border-radius: 7px; background: #1b1c20; }
  .fav .f32 { width: 32px; height: 32px; } .fav .f32 svg { width: 24px; height: 24px; }
  .fav .f16 { width: 16px; height: 16px; border-radius: 4px; } .fav .f16 svg { width: 13px; height: 13px; }
  .fav.l span { background: #fff; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.1); }
  .lock { display: flex; align-items: center; gap: 9px; font: 600 19px/1 var(--display); letter-spacing: -.025em; padding: 12px 14px; border-radius: 12px; }
  .lock.d { background: #0b0c0e; color: #f4f5f7; } .lock.l { background: #ecedf0; color: #0b0c0e; }
  .lock svg { width: 24px; height: 24px; overflow: visible; }
  .why { font: 400 14.5px/1.5 var(--sans); color: rgba(244,245,247,.7); margin: 0; }
  .why strong { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  // One warm brand light, the same marker colour the headline keyword uses.
  // Ink, not a hue: the app keeps colour for meaning (A–D, supports/counters), so the mark is neutral.
  // Its warmth comes from light, the same "light is alive" glow the crew gives off while it works.
  function defs(id, bg) {
    var ink = bg === "light" ? "#0b0c0e" : "#f4f5f7", top = bg === "light" ? "#2a2c33" : "#ffffff";
    return '<defs><linearGradient id="' + id + 'g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="' + ink + '"/><stop offset="1" stop-color="' + top + '"/></linearGradient></defs>';
  }

  function dim(bg) { return bg === "light" ? .18 : .24; }

  // A. Chosen: four slanted bars, the directions on a board. One runs full length and is lit; the others stay,
  //    shorter and quieter, because a set-aside option keeps its reasons.
  function chosen(id, bg) {
    var s = defs(id, bg), L = [46, 74, 38, 56], y = [22, 39, 56, 73], h = 12, k = 7;
    s += '<g transform="rotate(-32 50 50)">';
    L.forEach(function (len, i) {
      var x0 = 50 - 37, x1 = x0 + len, y0 = y[i] - 4, on = i === 1;
      var d = "M" + (x0 + k) + " " + y0 + " L" + (x1 + k) + " " + y0 + " L" + x1 + " " + (y0 + h) + " L" + x0 + " " + (y0 + h) + "Z";
      s += '<path d="' + d + '" fill="url(#' + id + 'g)" opacity="' + (on ? 1 : dim(bg)) + '" stroke="url(#' + id + 'g)" stroke-width="1.6" stroke-linejoin="round"/>';
    });
    return s + "</g>";
  }

  // B. Circled: the card you decided on, with the marker loop around it, passing behind and then in front.
  function circled(id, bg) {
    var s = defs(id, bg), gap = bg === "light" ? "#ffffff" : bg === "tile" ? "#18191d" : "#08090b";
    var rx = 44, ry = 15, rot = -24, cx = 50, cy = 52;
    function arc(a0, a1) { var o = "", n = 48; for (var i = 0; i <= n; i++) { var t = a0 + (a1 - a0) * i / n; o += (i ? " L" : "M") + (cx + rx * Math.cos(t)).toFixed(2) + " " + (cy + ry * Math.sin(t)).toFixed(2); } return o; }
    var ring = 'transform="rotate(' + rot + " " + cx + " " + cy + ')"';
    s += '<path d="' + arc(Math.PI, 2 * Math.PI) + '" ' + ring + ' fill="none" stroke="url(#' + id + 'g)" stroke-width="5.5" stroke-linecap="round" opacity=".55"/>';
    s += '<rect x="30" y="30" width="40" height="44" rx="10" transform="rotate(8 50 52)" fill="url(#' + id + 'g)"/>';
    s += '<path d="' + arc(0.05, Math.PI - 0.05) + '" ' + ring + ' fill="none" stroke="' + gap + '" stroke-width="11" stroke-linecap="round"/>';
    s += '<path d="' + arc(0, Math.PI) + '" ' + ring + ' fill="none" stroke="url(#' + id + 'g)" stroke-width="5.5" stroke-linecap="round"/>';
    return s;
  }

  // C. Shared: two cards, yours and the AI's, overlapping. Only where they overlap is it fully lit.
  function shared(id, bg) {
    var s = defs(id, bg);
    var A = '<rect x="14" y="20" width="48" height="48" rx="13" transform="rotate(-10 38 44)"/>';
    var B = '<rect x="38" y="32" width="48" height="48" rx="13" transform="rotate(-10 62 56)"/>';
    s += '<clipPath id="' + id + 'c">' + A + "</clipPath>";
    s += '<g fill="url(#' + id + 'g)" opacity="' + dim(bg) + '">' + A + B + "</g>";
    s += '<g fill="url(#' + id + 'g)" clip-path="url(#' + id + 'c)">' + B + "</g>";
    return s;
  }

  var OPTS = [
    { k: "A", name: "Chosen · one lit, the rest kept", fn: chosen,
      why: "<strong>Several options, one chosen, none forgotten.</strong> Four slanted bars are the directions on a board. One runs full length and is lit; the others stay shorter and quieter, because a set-aside option keeps its reasons." },
    { k: "B", name: "Circled · the decision, marked", fn: circled,
      why: "<strong>The one you decided on.</strong> A card with the marker loop around it, passing behind and then in front, the way you circle a choice on a whiteboard. Warm and human, but busier at small sizes." },
    { k: "C", name: "Shared · you and AI, overlapping", fn: shared,
      why: "<strong>A shared thinking space.</strong> Two cards, yours and the AI's. Only where they overlap is it fully lit. Says the positioning plainly, though overlap marks are common." }
  ];
  var n = 0;
  function svg(fn, bg) { var id = "m" + (n++); return '<svg viewBox="0 0 100 100" aria-hidden="true">' + fn(id, bg) + "</svg>"; }
  document.getElementById("grid").innerHTML = OPTS.map(function (o) {
    return '<section class="col">' +
      '<div class="tag"><b>' + o.k + "</b>" + o.name + "</div>" +
      '<div class="hero">' + svg(o.fn, "dark") + "</div>" +
      '<div class="row"><div class="tile dark">' + svg(o.fn, "tile") + '</div><div class="tile light">' + svg(o.fn, "light") + "</div>" +
      '<div><div class="fav"><span class="f32">' + svg(o.fn, "tile") + '</span><span class="f16">' + svg(o.fn, "tile") + '</span></div><div class="fav l" style="margin-top:10px"><span class="f32">' + svg(o.fn, "light") + '</span><span class="f16">' + svg(o.fn, "light") + "</span></div></div></div>" +
      '<div class="row"><div class="lock d">' + svg(o.fn, "dark") + 'Name</div><div class="lock l">' + svg(o.fn, "light") + "Name</div></div>" +
      '<p class="why">' + o.why + "</p></section>";
  }).join("");
})();
</script>
</body>
</html>
