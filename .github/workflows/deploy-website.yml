# Publishes /website to Cloudflare Pages on every merge to main (and on demand from the Actions tab).
# Uses Wrangler's direct upload, so it doesn't need Cloudflare's GitHub app. Pages Functions
# (website/functions) and the KV binding set in the Cloudflare dashboard work the same way.
# Needs one repository secret, CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit), under
# Settings > Secrets and variables > Actions > Secrets > Repository secrets. The account ID isn't
# secret, so it lives here (a CLOUDFLARE_ACCOUNT_ID secret overrides it). Without the token the
# run skips with a warning that says what's missing, instead of failing.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  PROJECT: vellum
  ACCOUNT_ID: d8cb67a08c3ed7d61518210e061b2d86

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: keys
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_AS_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "Found the CLOUDFLARE_API_TOKEN secret."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$TOKEN_AS_VAR" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is under the Variables tab, where anyone with access can read it. Delete it there and add it under Secrets > Repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No repository secret named CLOUDFLARE_API_TOKEN, so nothing was published. Add it under Settings > Secrets and variables > Actions > Secrets > Repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
          echo "account=${ACCOUNT:-$ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Create the Pages project (first run only)
        if: steps.keys.outputs.ready == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.keys.outputs.account }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJECT"; then
            echo "Project $PROJECT exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          fi

      - name: Publish
        if: steps.keys.outputs.ready == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.keys.outputs.account }}
        run: npx --yes wrangler@4 pages deploy . --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
