<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light"</script><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script><style>body{margin:0;background:var(--canvas)}#root{padding:20px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.col{display:grid;gap:14px;justify-items:start}</style><style>.stage{position:relative}.demo-card{position:absolute;width:150px;height:64px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-card);font:600 13px/1.3 var(--font-ui);color:var(--label);padding:12px 14px}</style></head>

<div id="root"></div>

  h(V.InlineAlert,{tone:'warn',title:'This source changed',action:h(V.Button,{size:'sm'},'Review')},'Player P07 Voice Debrief is now v2. Directions built on v1 may be out of date.'),
  h(V.InlineAlert,{tone:'danger',title:'Couldn’t save',action:h(V.Button,{size:'sm',icon:'retry'},'Retry')},'Your changes are kept in this browser.'),
  h(V.InlineAlert,{tone:'ok'},'Snapshot No. 1 is ready to share.')));
</script>
