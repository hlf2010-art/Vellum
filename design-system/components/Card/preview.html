<div id="root"></div>
<script>

ReactDOM.createRoot(document.getElementById('root')).render(h(V.Root, null,

    h(V.Card, { key: 1, kind: 'source', eyebrow: 'MD · Playtest Telemetry', title: '12-Player Eye-Tracking Audit', weight: 'observed', meta: '4:19 AM' }, '9 of 12 testers missed top-right faction notifications during rooftop traversal.'),

    h(V.Card, { key: 3, kind: 'kanban', by: 'wright', title: 'Milestone 3 · Vertical Slice Execution', meta: '8:16 AM', columns: [{ title: 'Spec & Rig', items: ['Final Localization String Pass'] }, { title: 'In Playtest', items: ['Add Diamond Colorblind Rim Chevron', 'Rain Particle LOD Contrast Audit'] }, { title: 'Locked', items: ['Wire wrist-pager shader uniform', 'Tune 2-tap / 3-pulse haptic asset'] }] })

    h(V.Card, { key: 2, kind: 'direction', lineage: 'A', title: 'Corner Toast + Audio Chime', meta: 'Guided Tour', proposal: { member: 'critic', op: 'delete' } }, 'Keep top-right notifications and boost alert chime volume during combat.'),
    h(V.Card, { key: 3, kind: 'idea', locked: true, title: 'Players read faction shifts in under 1.2s when deltas come from the world.', rating: { observed: 4, reported: 1, unrated: 2 }, meta: '2 notes · 5:44 AM' })
  ]),
  sec('States', [
    h(V.Card, { key: 1, kind: 'source', selected: true, eyebrow: 'MD · Playtest Telemetry', title: 'Selected', weight: 'observed', meta: '4:19 AM' }, 'A focus-colour ring. Tab moves through cards; Enter opens.'),

    h(V.Card, { key: 3, kind: 'idea', state: 'error', onRetry: function(){}, title: 'Players read faction shifts in under 1.2s.', meta: '5:44 AM' })
  ]),
  sec('Snapshot · decided', [
    h(V.Card, { key: 1, kind: 'snapshot', lineage: 'B', edition: 1, of: 'of proof v2', title: 'Diegetic Faction Dispatch HUD', footLeft: 'Standalone HTML', meta: '8:06 AM' }, 'Every faction delta fires on the wrist pager and NPC rim-glow within 0.85s.'),
    h(V.Card, { key: 2, kind: 'group', title: '01 · Gather · Telemetry, Concept & Brief' },
      h(V.Card, { kind: 'note', title: 'Cards dropped inside a group move with it.', meta: '5:51 AM' }),
      h(V.Card, { kind: 'source', eyebrow: 'CSV · Session log', title: 'Rooftop traversal timings', weight: 'observed', meta: '4:02 AM' }))
